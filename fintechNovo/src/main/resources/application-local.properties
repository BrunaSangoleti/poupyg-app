# ==============================================================
#  Perfil LOCAL - Sobrescreve as variáveis de ambiente da IDE
#  Ative em: Run Configurations -> Active profiles -> "local"
# ==============================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/fintech
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true

api.security.token.secret=my-secret-key-local-development-only
