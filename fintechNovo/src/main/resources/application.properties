spring.application.name=fintechNovo
server.port=${PORT:8081}

# ============================================================
# Datasource - usa variáveis individuais (simples e direto)
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintech}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate - ddl-auto=none: Flyway controla o schema
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ============================================================
# Flyway - auto-configura a partir do datasource acima
# NAO definir flyway.url/user/password: evita conflito
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# ============================================================
# JWT
# ============================================================
api.security.token.secret=${JWT_SECRET:my-secret-key-that-should-be-very-long-and-secure}
