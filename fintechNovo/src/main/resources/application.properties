spring.application.name=fintechNovo
server.port=${PORT:8081}

# ============================================================
# Datasource - aceita DATABASE_URL completa (Neon/Render)
# ou monta a partir de variáveis individuais com SSL embutido
# ============================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintech}?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari pool - necessário para conexões SSL com Neon
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ============================================================
# JPA / Hibernate
# ddl-auto=none: Flyway é o único responsável pelo schema
# ============================================================
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# ============================================================
# Flyway - roda as migrations antes do Hibernate iniciar
# ============================================================
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# ============================================================
# Segurança - JWT
# ============================================================
api.security.token.secret=${JWT_SECRET:my-secret-key-that-should-be-very-long-and-secure}
