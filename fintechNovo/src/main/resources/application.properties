spring.application.name=fintechNovo
server.port=${PORT:8081}

# ============================================================
# Datasource
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintech}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# validate: verifica se as tabelas existem (criadas no Neon)
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ============================================================
# Flyway DESABILITADO - tabelas criadas manualmente no Neon
# ============================================================
spring.flyway.enabled=false

# ============================================================
# JWT
# ============================================================
api.security.token.secret=${JWT_SECRET:my-secret-key-that-should-be-very-long-and-secure}
